name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Descomprimir y compilar
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -1)
          if [ -n "$ZIP" ]; then unzip -o -q "$ZIP"; fi
          DIR=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)")
          cd "$DIR"
          gradle assembleDebug --no-daemon
          cp "$(find . -name app-debug.apk | head -1)" "$GITHUB_WORKSPACE/LB-Watchlist.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LB-Watchlist-apk
          path: LB-Watchlist.apk
